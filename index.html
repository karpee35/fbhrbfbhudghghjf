<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); margin: 0; padding: 15px; }
        .card { background: var(--tg-theme-secondary-bg-color); border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .search-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .btn { padding: 10px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-play { background: #3390ec; color: #fff; margin-right: 5px; }
        .btn-select { background: #28a745; color: #fff; }
        .playlist-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); padding: 20px; z-index: 100; }
        .modal-content { background: var(--tg-theme-bg-color); border-radius: 20px; padding: 20px; }
        .pl-item { padding: 15px; border-bottom: 1px solid #ddd; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔎 Глобальный поиск</h3>
        <input type="text" id="q" placeholder="Исполнитель и название...">
        <button class="btn btn-play" style="width: 100%; margin-top: 10px;" onclick="startSearch()">Найти треки</button>
    </div>

    <div id="results" class="card" style="display: none;">
        <h4>Результаты (можно прослушать):</h4>
        <div id="results-list"></div>
    </div>

    <div id="modal" class="playlist-modal">
        <div class="modal-content">
            <h3>В какой плейлист добавить?</h3>
            <div id="pl-list"></div>
            <button class="btn btn-play" style="width: 100%; margin-top: 15px; background: #666;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedTrack = null;
        const urlParams = new URLSearchParams(window.location.search);
        const userPlaylists = urlParams.get('pls') ? urlParams.get('pls').split(',') : [];

        function startSearch() {
            const q = document.getElementById('q').value;
            if(!q) return tg.showAlert("Введите название!");
            
            // Имитация поиска (в идеале тут fetch к API)
            document.getElementById('results').style.display = 'block';
            const list = document.getElementById('results-list');
            list.innerHTML = `
                <div class="search-item">
                    <span>${q} (Official)</span>
                    <div>
                        <button class="btn btn-play" onclick="tg.showAlert('Тут будет играть аудио...')">▶️</button>
                        <button class="btn btn-select" onclick="openModal('${q}')">Выбрать</button>
                    </div>
                </div>
            `;
        }

        function openModal(track) {
            selectedTrack = track;
            const plContainer = document.getElementById('pl-list');
            plContainer.innerHTML = '';
            
            if(userPlaylists.length === 0) {
                plContainer.innerHTML = '<p>Сначала создайте плейлист в чате!</p>';
            }

            userPlaylists.forEach(name => {
                const div = document.createElement('div');
                div.className = 'pl-item';
                div.innerText = name;
                div.onclick = () => confirmAdd(name);
                plContainer.appendChild(div);
            });
            document.getElementById('modal').style.display = 'block';
        }

        function confirmAdd(plName) {
            tg.sendData(JSON.stringify({
                action: 'final_add',
                query: selectedTrack,
                playlist: plName
            }));
            tg.close();
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
