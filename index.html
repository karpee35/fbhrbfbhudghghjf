<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; text-align: center; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 20px; }
        input { width: 90%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>🎵 Мой Плеер</h2>
    <input type="text" id="songName" placeholder="Введите название песни">
    <button onclick="sendData()">🔍 Найти и отправить в чат</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function sendData() {
            const name = document.getElementById('songName').value;
            if (name) {
                // Отправляем данные боту
                tg.sendData(JSON.stringify({ query: name }));
            }
        }
    </script>
</body>
</html>
