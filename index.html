<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: none; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #3390ec; color: white; font-weight: bold; cursor: pointer; }
        .hint { font-size: 12px; color: #aaa; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🔍 Поиск музыки</h3>
        <input type="text" id="q" placeholder="Исполнитель и песня...">
        <button onclick="send('search')">Найти варианты</button>
        <p class="hint">Бот пришлет 3 аудио-файла в чат. Ты сможешь их послушать и выбрать плейлист.</p>
    </div>

    <div class="card">
        <h3>📁 Новый плейлист</h3>
        <input type="text" id="pl" placeholder="Название (например, Рок)">
        <button style="background: #28a745;" onclick="send('create')">Создать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        function send(action) {
            const val = action === 'search' ? document.getElementById('q').value : document.getElementById('pl').value;
            if(!val) return;
            tg.sendData(JSON.stringify({action: action, data: val}));
            tg.close();
        }
    </script>
</body>
</html>
